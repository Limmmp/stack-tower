<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>Башня</title>
<style>
  html,body{margin:0;height:100%;background:#0b0e18;overflow:hidden;
    font-family:system-ui,-apple-system,'Segoe UI',sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  #wrap{position:relative;transform-origin:center center}
  canvas{display:block;border-radius:14px}
  .btn{position:absolute;left:50%;transform:translateX(-50%);
    display:flex;align-items:center;gap:10px;
    padding:15px 36px;border:0;border-radius:999px;
    font:600 20px/1 system-ui,sans-serif;color:#fff;cursor:pointer;white-space:nowrap;
    box-shadow:0 6px 20px rgba(0,0,0,.35)}
  /* display:flex перебивает display:none из атрибута hidden — возвращаем явно,
     иначе скрытые кнопки остаются на экране. */
  .btn[hidden]{display:none}
  .btn svg{width:22px;height:22px;flex:none}
  .btn:active{transform:translateX(-50%) scale(.96)}
  .btn:disabled{opacity:.5;cursor:default}
  #btn-play{top:420px;background:#4a8cff}
  #btn-revive{top:390px;background:#2fae62}
  #btn-restart{top:456px;background:#4a8cff}
</style>
<!-- SDK обязателен для прохождения модерации, даже без монетизации.
     Абсолютные URL на серверы Яндекса запрещены — только этот путь. -->
<script src="/sdk.js"></script>
</head>
<body>
  <div id="stage">
    <div id="wrap">
      <canvas id="game"></canvas>
      <button class="btn" id="btn-play" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l11-6.5z" fill="currentColor"/></svg>
        Играть
      </button>
      <button class="btn" id="btn-revive" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="2.5" y="5.5" width="14" height="13" rx="2.5" fill="none" stroke="currentColor" stroke-width="2"/>
          <path d="M16.5 11l5-3.2v8.4l-5-3.2z" fill="currentColor"/>
        </svg>
        Продолжить за рекламу
      </button>
      <button class="btn" id="btn-restart" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 4.5a7.5 7.5 0 1 0 7.2 9.6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
          <path d="M12 1.4v6.2l4-3.1z" fill="currentColor"/>
        </svg>
        Заново
      </button>
    </div>
  </div>
  <script type="module" src="game.js"></script>
</body>
</html>
